minimum_pre_commit_version: '4.7.0'
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500, --enforce-all]
      - id: detect-private-key
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: staged-secrets
        name: Gitleaks (staged changes)
        entry: .tools/hook-tools/gitleaks protect --staged --redact --no-banner
        language: system
        always_run: true
        pass_filenames: false
      - id: python-tests
        name: Repository policy regression tests
        entry: python3 -m unittest discover -s scripts -p test_*.py
        language: system
        files: ^(scripts/|compatibility.json|.github/)
        pass_filenames: false
