name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'
permissions:
  contents: read
concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    name: Source and contribution policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install checksum-pinned contributor tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          make hook-tools
      - name: Run contributor hooks and policy regression tests
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/extension-pre-commit
        run: make hooks-check policy-check
      - name: Scan the complete component history for secrets
        run: .tools/hook-tools/gitleaks git --redact --no-banner .
      - name: Verify every pull-request commit's DCO certification
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-dco.py --base "$DCO_BASE_SHA" --head "$DCO_HEAD_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Audit visible live GitHub protections weekly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-rulesets.py --live --allow-hidden-bypass
  qualify:
    name: Native Keycloak ${{ matrix.keycloak }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.0", "26.8.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Qualify native behavior and rehearse SDK release assets
        run: MAVEN_REPO_LOCAL="$HOME/.m2/repository" make release-dry-run KEYCLOAK_VERSION=${{ matrix.keycloak }}
      - name: Preserve the immutable SDK candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.keycloak }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/${{ matrix.keycloak }}/release-dry-run/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve native qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ matrix.keycloak }}
          path: |
            target/${{ matrix.keycloak }}/surefire-reports/
            target/${{ matrix.keycloak }}/failsafe-reports/
            target/${{ matrix.keycloak }}/qualification/
            target/${{ matrix.keycloak }}/sbom.json
          if-no-files-found: error
          retention-days: 30
  rehearsal:
    name: Release bundle rehearsal
    needs: [qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/incoming
          merge-multiple: true
      - name: Verify every SDK hash and assemble the complete candidate
        run: python3 scripts/release.py assemble --incoming target/incoming --output target/release-rehearsal --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NONPUBLISHABLE-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-rehearsal/
          if-no-files-found: error
          retention-days: 30
  checks:
    name: Extension checks
    needs: [policy, qualify, rehearsal]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete source and compatibility matrix
        env:
          POLICY: ${{ needs.policy.result }}
          QUALIFY: ${{ needs.qualify.result }}
          REHEARSAL: ${{ needs.rehearsal.result }}
        run: |
          test "$POLICY" = success
          test "$QUALIFY" = success
          test "$REHEARSAL" = success
