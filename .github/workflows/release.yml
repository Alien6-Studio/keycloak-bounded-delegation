name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub-verified annotated release tag on protected main (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: extension-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require a verified annotated tag and matching source on protected main
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py verify-tag --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" > "$RUNNER_TEMP/eligibility.json"
          python3 -c 'import json, os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/eligibility.json")); print("revision="+r["revision"])' >> "$GITHUB_OUTPUT"
  policy:
    needs: [eligibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: make policy-check
  qualify:
    env:
      SE_AVOID_STATS: 'true'
    needs: [eligibility, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.0", "26.8.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Requalify the exact tagged source and build release components
        run: MAVEN_REPO_LOCAL="$HOME/.m2/repository" make integration-test RELEASE_ASSETS=1 KEYCLOAK_VERSION=${{ matrix.keycloak }}
      - run: python3 scripts/release.py package --keycloak-version ${{ matrix.keycloak }} --output target/${{ matrix.keycloak }}/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.keycloak }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/${{ matrix.keycloak }}/release/
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: [eligibility, policy, qualify]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/incoming
          merge-multiple: true
      - name: Recheck tag identity and validate the complete artifact graph
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py verify-tag --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          python3 scripts/release.py assemble --incoming target/incoming --output target/distribution
      - name: Attest the verified distribution
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/distribution/*
      - name: Verify attestations and create a version-classified draft
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in target/distribution/*; do gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"; done
          python3 scripts/release.py verify-tag --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" target/distribution/* --repo "$GITHUB_REPOSITORY" \
            --draft "${flags[@]}" --verify-tag --target "$(git rev-parse HEAD)" \
            --title "Keycloak Bounded Delegation $RELEASE_TAG" --notes-file target/distribution/RELEASE_NOTES.md
