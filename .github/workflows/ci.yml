name: Keycloak extension
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'
permissions:
  contents: read
concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    name: Source and contribution policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install checksum-pinned contributor tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          make hook-tools
      - name: Run contributor hooks and policy regression tests
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/extension-pre-commit
        run: make hooks-check policy-check
      - name: Scan the complete component history for secrets
        run: .tools/hook-tools/gitleaks git --redact --no-banner .
      - name: Verify every pull-request commit's DCO certification
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-dco.py --base "$DCO_BASE_SHA" --head "$DCO_HEAD_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Audit visible live GitHub protections weekly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-rulesets.py --live --allow-hidden-bypass
  qualify:
    name: Java and HTTPS Keycloak ${{ matrix.keycloak }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Checkout the pinned consumer interoperability harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alien6-Studio/hankoshell-operator
          ref: 7df9282fa27b55c0af6186564d53ccf6c1de5942
          path: qualification
          persist-credentials: false
      - run: make integration-test KEYCLOAK_VERSION=${{ matrix.keycloak }} QUALIFICATION_DIR="$GITHUB_WORKSPACE/qualification"
      - name: Preserve Java and interoperability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-${{ matrix.keycloak }}
          path: |
            target/${{ matrix.keycloak }}/surefire-reports/
            target/${{ matrix.keycloak }}/interop/
          if-no-files-found: error
          retention-days: 30
  checks:
    name: Extension checks
    needs: [policy, qualify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete source and compatibility matrix
        env:
          POLICY: ${{ needs.policy.result }}
          QUALIFY: ${{ needs.qualify.result }}
        run: |
          test "$POLICY" = success
          test "$QUALIFY" = success
